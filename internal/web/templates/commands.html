{{define "commands"}}
<section class="content-section" aria-labelledby="commands-heading">
  <h2 id="commands-heading">{{if .LatestLabel}}Try latest{{else}}Use this stack{{end}}</h2>
  <div class="command-list">
    <div class="command-row" data-copy-row>
      <code data-copy-text>{{.Commands.Try}}</code>
      <button class="copy-button" type="button" data-copy-button hidden aria-label="Copy command" title="Copy command"><svg class="icon-copy" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="8" y="8" rx="2" ry="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg><svg class="icon-check" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"></path></svg></button>
      <span data-copy-status role="status" aria-live="polite"></span>
    </div>
    <div class="command-row" data-copy-row>
      <code data-copy-text>{{.Commands.Clone}}</code>
      <button class="copy-button" type="button" data-copy-button hidden aria-label="Copy command" title="Copy command"><svg class="icon-copy" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="8" y="8" rx="2" ry="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg><svg class="icon-check" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"></path></svg></button>
      <span data-copy-status role="status" aria-live="polite"></span>
    </div>
  </div>
</section>
{{end}}
