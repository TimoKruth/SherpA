name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # The store test harness starts postgres:16 through Docker and skips when
      # Docker is unavailable. GitHub-hosted runners provide Docker, so the real
      # Postgres tests execute here rather than skipping.
      - name: go test (race)
        run: go test -race ./...

  collector-smoke:
    name: collector smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Native runners make the runtime and Borg checks architecture-exact; the
      # smoke script also scans the complete image and starts the hardened
      # Compose service from an exact committed source archive.
      - name: collector release gate
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          SHERPA_COLLECTOR_SMOKE_IMAGE: sherpa-collector:ci
        run: bash deploy/collector/smoke_build.sh

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build sherpa
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          name="sherpa-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then name="${name}.exe"; fi
          go build -trimpath -o "dist/${name}" ./cmd/sherpa
          ls -l "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: sherpa-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
