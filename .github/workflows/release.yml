name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  PKG_IDENTIFIER: de.kruth-support.sherpa

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A release must not ship code that does not build or pass its tests.
      # Docker is available here, so the real Postgres tests run rather than skip.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build-portable:
    name: build linux and windows
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for target in linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            name="sherpa-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then name="${name}.exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X sherpa/internal/cli.Version=${version}" \
              -o "dist/${name}" ./cmd/sherpa
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist/
          retention-days: 1

  build-macos:
    name: build macos
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Signing is optional so releases keep working before the Apple Developer
      # Program credentials exist. Without them the binaries ship exactly as they
      # do today: ad-hoc linker-signed, fine for curl installs, rejected by
      # Gatekeeper on a browser download. The .pkg is published only when it can
      # be signed and notarized, because an unsigned installer would be blocked
      # anyway and would imply a guarantee it cannot make.
      - name: determine signing availability
        id: signing
        env:
          APP_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APP_CERT" ] && [ -n "$INSTALLER_CERT" ] && [ -n "$API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets are absent; publishing unsigned binaries and no .pkg"
          fi

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for goarch in arm64 amd64; do
            GOOS=darwin GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X sherpa/internal/cli.Version=${version}" \
              -o "dist/sherpa-darwin-${goarch}" ./cmd/sherpa
          done
          ls -l dist

      - name: import signing certificates
        if: steps.signing.outputs.enabled == 'true'
        env:
          APP_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for pair in "APP:$APP_CERT:$APP_CERT_PASSWORD" "INSTALLER:$INSTALLER_CERT:$INSTALLER_CERT_PASSWORD"; do
            label="${pair%%:*}"
            rest="${pair#*:}"
            data="${rest%%:*}"
            secret="${rest#*:}"
            printf '%s' "$data" | base64 --decode > "$RUNNER_TEMP/${label}.p12"
            security import "$RUNNER_TEMP/${label}.p12" -k "$keychain" -P "$secret" \
              -T /usr/bin/codesign -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/${label}.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: sign binaries
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          for binary in dist/sherpa-darwin-*; do
            # The hardened runtime and a secure timestamp are both mandatory for
            # notarization to succeed.
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done

      - name: build installer package
        if: steps.signing.outputs.enabled == 'true'
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          root="$RUNNER_TEMP/pkgroot"
          mkdir -p "$root/usr/local/bin"
          # The installer must serve both architectures. Selecting by the
          # runner's own uname would ship an arm64-only package that silently
          # fails on Intel Macs, so combine the two builds instead.
          lipo -create -output "$root/usr/local/bin/sherpa" \
            dist/sherpa-darwin-arm64 dist/sherpa-darwin-amd64
          lipo -info "$root/usr/local/bin/sherpa"
          chmod 0755 "$root/usr/local/bin/sherpa"
          # Extended attributes become ._ AppleDouble entries inside the payload.
          xattr -cr "$root"
          # lipo produces a new Mach-O, so the combined binary carries no
          # signature from its inputs and must be signed itself.
          codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$root/usr/local/bin/sherpa"
          codesign --verify --strict "$root/usr/local/bin/sherpa"
          pkgbuild --root "$root" \
            --identifier "$PKG_IDENTIFIER" \
            --version "${version#v}" \
            --install-location / \
            "$RUNNER_TEMP/sherpa-unsigned.pkg"
          productsign --sign "$INSTALLER_IDENTITY" \
            "$RUNNER_TEMP/sherpa-unsigned.pkg" "dist/sherpa-macos.pkg"
          pkgutil --check-signature "dist/sherpa-macos.pkg"

      - name: notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY" | base64 --decode > "$key"
          xcrun notarytool submit "dist/sherpa-macos.pkg" \
            --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$key"
          # Stapling attaches the ticket so Gatekeeper succeeds offline. It works
          # on the .pkg but not on a bare Mach-O executable, which is why the
          # plain binaries rely on an online check instead.
          xcrun stapler staple "dist/sherpa-macos.pkg"
          xcrun stapler validate "dist/sherpa-macos.pkg"

      - name: verify Gatekeeper acceptance
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          for binary in dist/sherpa-darwin-*; do
            spctl --assess --type execute -vv "$binary"
          done
          spctl --assess --type install -vv "dist/sherpa-macos.pkg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          retention-days: 1

  publish:
    name: publish release
    needs: [build-portable, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: staged

      - name: collect artifacts and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f -exec mv {} dist/ \;
          cd dist
          # Checksums are generated here, after signing and stapling. Both
          # rewrite their artifact, so a checksum taken earlier would not match
          # what ships.
          sha256sum sherpa-* > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          # Any tag carrying a prerelease suffix (v1.2.3-beta.1) publishes as a
          # prerelease so it is not served as "latest".
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$version" \
            --title "$version" \
            --generate-notes \
            --verify-tag \
            $prerelease \
            dist/sherpa-* dist/SHA256SUMS
