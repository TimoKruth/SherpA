name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A release must not ship code that does not build or pass its tests.
      # Docker is available here, so the real Postgres tests run rather than skip.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build all targets
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            name="sherpa-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then name="${name}.exe"; fi
            echo "building ${name} (${version})"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X sherpa/internal/cli.Version=${version}" \
              -o "dist/${name}" ./cmd/sherpa
          done
          cd dist
          sha256sum sherpa-* > SHA256SUMS
          cat SHA256SUMS

      # Proves the stamped binary reports the tag rather than the dev default.
      - name: verify stamped version
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          got="$(./dist/sherpa-linux-amd64 version)"
          echo "reported: ${got}"
          test "${got}" = "sherpa ${version}"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          # Any tag carrying a prerelease suffix (v1.2.3-beta.1) publishes as a
          # prerelease so it is not served as "latest".
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$version" \
            --title "$version" \
            --generate-notes \
            --verify-tag \
            $prerelease \
            dist/sherpa-* dist/SHA256SUMS
